/* ================= CAP · identité v4 — NIGHT PRO / IVOIRE ================= */
:root{--bg:#090a0d;--s1:#0f1115;--s2:#15181e;--s3:#1d2129;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.15);--tx:#f2f3f5;--t2:rgba(242,243,245,.62);--t3:rgba(242,243,245,.36);
 --a:#ffd60a;--aT:#0b0b0d;--b:#74dfee;--c:#ff6b61;--ok:#5fe0a0;--glass:rgba(15,17,21,.74);--sh:0 28px 70px rgba(0,0,0,.6);--glow:drop-shadow(0 0 7px rgba(255,214,10,.5));
 --D:"Sora",system-ui,sans-serif;--U:"Sora",system-ui,sans-serif;--L:"Michroma","Sora",sans-serif;--Lsz:8.500px;--Lsp:.2em;--Lw:400;--dw:300;--hw:300;--htr:-.035em;
 --mapb:1;--tile:brightness(calc(1.3*var(--mapb))) contrast(1.08) saturate(.85);
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--nav:84px;--peek:150px;--r:22px;--r2:15px;--ease:cubic-bezier(.32,.72,0,1)}
[data-theme=ivory]{--bg:#f3eee4;--s1:#f8f4ec;--s2:#fffdf8;--s3:#efe8da;--ln:rgba(40,34,26,.1);--ln2:rgba(40,34,26,.2);--tx:#26211a;--t2:rgba(38,33,26,.66);--t3:rgba(38,33,26,.44);
 --a:#b9562f;--aT:#fffdf8;--b:#2c6b70;--c:#a3271f;--ok:#3c7a50;--glass:rgba(250,246,238,.8);--sh:0 22px 60px rgba(70,48,24,.16);--glow:drop-shadow(0 1px 2px rgba(60,30,10,.3));
 --D:"Newsreader",Georgia,serif;--U:"Instrument Sans",system-ui,sans-serif;--L:"Instrument Sans",system-ui,sans-serif;--Lsz:10.500px;--Lsp:.11em;--Lw:600;--dw:400;--hw:400;--htr:-.02em;
 --tile:sepia(.2) saturate(.82) brightness(calc(1.01*var(--mapb)))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:400 15px/1.45 var(--U);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;transition:transform .14s var(--ease),background .25s,border-color .25s,color .25s,opacity .2s}
button:active,a.card:active,a.ghost:active{transform:scale(.972)}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:var(--r2);padding:13px 14px;outline:0;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--t3)}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
select option{background:var(--s2);color:var(--tx)}textarea{min-height:96px;resize:vertical;line-height:1.5}
a{color:var(--a)}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.600;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.emo{display:none}
.num{font-family:var(--D);font-variant-numeric:tabular-nums}
.lab{font:var(--Lw) var(--Lsz)/1.4 var(--L);letter-spacing:var(--Lsp);text-transform:uppercase;color:var(--t3)}
.sec{margin:30px 0 12px;display:flex;align-items:center;gap:12px;color:var(--t2)}
.sec:after{content:"";flex:1;height:1px;background:var(--ln)}
.sub{color:var(--t2);font-size:13.500px;line-height:1.5}
[hidden]{display:none!important}
/* ---------- carte ---------- */
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{background:var(--bg);font:inherit}
.leaflet-tile-pane{filter:var(--tile)}
[data-theme=night] .osmdark .leaflet-tile,:root:not([data-theme=ivory]) .osmdark .leaflet-tile{filter:invert(1) grayscale(.9) brightness(.82) contrast(1.08)}
.leaflet-control-attribution{background:transparent!important;color:var(--t3)!important;font:9px var(--U)!important;margin:0 8px calc(var(--peek) + var(--nav) + var(--sab) + 2px) 0!important}
.leaflet-control-attribution a{color:var(--t3)!important}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent) 0,transparent 24%,transparent 58%,color-mix(in srgb,var(--bg) 70%,transparent) 100%),radial-gradient(ellipse at 50% 42%,transparent 50%,color-mix(in srgb,var(--bg) 55%,transparent) 100%)}
[data-theme=ivory] #fx{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 94%,transparent) 0,transparent 22%,transparent 64%,color-mix(in srgb,var(--bg) 60%,transparent) 100%)}
#hud{display:none}
/* ---------- haut ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(var(--sat) + 12px) 14px 0;pointer-events:none}
#top>*{pointer-events:auto}
.gls{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--ln);box-shadow:var(--sh)}
#search{display:flex;align-items:center;gap:12px;height:54px;border-radius:27px;padding:0 18px 0 20px}
#search input{border:0;background:none;box-shadow:none!important;padding:0;border-radius:0}
#brand{font:400 11px var(--L);letter-spacing:.34em;color:var(--a);padding-right:14px;border-right:1px solid var(--ln2)}
[data-theme=ivory] #brand{font:italic 500 21px var(--D);letter-spacing:0;text-transform:none}
#chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font:var(--Lw) var(--Lsz) var(--L);letter-spacing:var(--Lsp);text-transform:uppercase;padding:7px 11px;border-radius:99px;display:flex;align-items:center;gap:7px;color:var(--t2);box-shadow:none}
.chip i{width:5px;height:5px;border-radius:50%;background:var(--t3)}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--a)}.chip.bad i{background:var(--c)}
#results{margin-top:10px;border-radius:var(--r);overflow:hidden;max-height:46vh;overflow-y:auto}
#results button{display:block;width:100%;padding:14px 18px;border-bottom:1px solid var(--ln)}
#results b{display:block;font:500 15.500px var(--U)}#results span{color:var(--t2);font-size:12.500px}
#banner{display:flex;gap:16px;align-items:center;padding:14px 18px 14px 14px;border-radius:26px}
#banner .arrow{width:60px;height:60px;border-radius:19px;background:var(--a);color:var(--aT);display:grid;place-items:center;flex:none}
#banner .arrow svg{width:30px;height:30px;stroke-width:2.200;transition:transform .45s var(--ease)}
#banner.bus .arrow{background:var(--b);color:var(--bg)}
#banner .d{font:var(--dw) 38px/1 var(--D);letter-spacing:var(--htr);font-variant-numeric:tabular-nums}
#banner .t{color:var(--t2);font-size:14px;margin-top:5px;line-height:1.35}
#fabs{position:fixed;right:14px;bottom:calc(var(--peek) + var(--nav) + var(--sab) + 16px);z-index:15;display:flex;flex-direction:column;gap:10px;transition:bottom .5s var(--ease)}
.fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--t2)}
.fab.on{color:var(--a)}
/* ---------- feuille & navigation ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;height:90vh;border-radius:30px 30px 0 0;background:var(--s1);border:1px solid var(--ln);border-bottom:0;box-shadow:0 -24px 70px rgba(0,0,0,.34);transform:translateY(calc(100% - var(--peek) - var(--nav) - var(--sab)));transition:transform .55s var(--ease),background .4s;display:flex;flex-direction:column;backdrop-filter:none}
[data-theme=ivory] #sheet{box-shadow:0 -18px 50px rgba(70,48,24,.13)}
#sheet.open{transform:translateY(0)}#sheet.mid{transform:translateY(44%)}
body.trip{--nav:0px}
#grab{padding:11px 0 9px;flex:none;touch-action:none;display:flex;justify-content:center}
#grab i{display:none}#grab i:first-child{display:block;width:38px;height:4px;border-radius:2px;background:var(--ln2)}
#body{flex:1;overflow-y:auto;padding:2px 20px calc(var(--nav) + var(--sab) + 40px);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#body::-webkit-scrollbar{display:none}
#body.anim>*{animation:in .6s var(--ease) both}
#body.anim>*:nth-child(2){animation-delay:.04s}#body.anim>*:nth-child(3){animation-delay:.08s}#body.anim>*:nth-child(4){animation-delay:.12s}#body.anim>*:nth-child(5){animation-delay:.16s}#body.anim>*:nth-child(6){animation-delay:.2s}#body.anim>*:nth-child(n+7){animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
#nav{position:fixed;left:14px;right:14px;bottom:calc(var(--sab) + 12px);height:64px;z-index:40;display:flex;padding:6px;border-radius:32px;background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--ln);box-shadow:var(--sh)}
body.trip #nav{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--t3);font:var(--Lw) 7.500px var(--L);letter-spacing:.16em;border-radius:26px}
[data-theme=ivory] #nav button{font-size:9.500px;letter-spacing:.07em}
#nav button svg{width:22px;height:22px;transition:transform .35s var(--ease)}
#nav button.on{color:var(--tx);background:color-mix(in srgb,var(--tx) 8%,transparent)}
#nav button.on svg{color:var(--a);transform:translateY(-1px)}
/* ---------- typographie ---------- */
h1{font:var(--hw) 31px/1.08 var(--D);letter-spacing:var(--htr);margin:6px 0 4px}
h1 em{font-style:normal;color:var(--a)}
[data-theme=ivory] h1{font-size:35px}[data-theme=ivory] h1 em{font-style:italic}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:4px}
.hero{position:relative;margin:0 -20px 6px;padding:10px 20px 22px;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero:before{content:"";position:absolute;left:-30%;right:-30%;bottom:-190px;height:260px;border-radius:50%;border-top:1px solid color-mix(in srgb,var(--a) 55%,transparent);background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--a) 13%,transparent),transparent 62%);pointer-events:none}
.hero:after{content:"";position:absolute;bottom:68px;left:0;width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--a),transparent);animation:run 5.500s var(--ease) infinite;opacity:.9}
@keyframes run{0%{transform:translate(-90px,14px)}50%{transform:translate(46vw,0)}100%{transform:translate(100vw,14px)}}
[data-theme=ivory] .hero:before{border-top-color:var(--ln2);background:none}[data-theme=ivory] .hero:after{display:none}
.hero .hin{position:relative;z-index:1}.hero h1{font-size:36px;margin:8px 0 8px}[data-theme=ivory] .hero h1{font-size:41px}
.hmeta{font-size:13px;color:var(--t2)}
.mono{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln2);font:500 17px var(--D);color:var(--tx);background:var(--s2);flex:none}
.mono.lg{width:66px;height:66px;font-size:26px;border-color:color-mix(in srgb,var(--a) 60%,transparent)}
.tabs{display:flex;gap:7px;overflow-x:auto;margin:14px -20px 0;padding:0 20px 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:10px 15px;border-radius:99px;border:1px solid var(--ln);font:500 13px var(--U);letter-spacing:.01em;display:flex;align-items:center;gap:7px;color:var(--t2);text-transform:lowercase}
.tb svg.i{width:15px;height:15px}
.tb.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
/* ---------- cartes & listes ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.rail{display:flex;gap:11px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x proximity;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:158px;min-height:172px;scroll-snap-align:start;justify-content:flex-end}
.card{position:relative;background:var(--s2);border:1px solid var(--ln);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:5px;min-height:112px;overflow:hidden}
.rail .card:first-child{background:linear-gradient(160deg,color-mix(in srgb,var(--a) 15%,var(--s2)),var(--s2) 62%);border-color:color-mix(in srgb,var(--a) 28%,transparent)}
.card .icn{position:absolute;left:16px;top:16px;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx)}
.grid .card .icn{position:static;margin-bottom:6px}
.card b{font:500 16.500px/1.2 var(--U);letter-spacing:-.01em}
[data-theme=ivory] .card b{font:500 19px/1.15 var(--D)}
.card .m{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .eta{position:absolute;top:15px;right:16px;font:var(--dw) 26px/1 var(--D);letter-spacing:var(--htr);color:var(--tx);font-variant-numeric:tabular-nums}
.row{display:flex;gap:13px;align-items:center;padding:14px 15px;background:var(--s2);border:1px solid var(--ln);border-radius:18px;margin-bottom:8px;width:100%}
.row>svg.i{color:var(--t2)}
.row .g{flex:1;min-width:0}.row b{display:block;font:500 15px/1.25 var(--U)}.row .m{color:var(--t2);font-size:12.500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .r{font:var(--dw) 19px/1.1 var(--D);letter-spacing:var(--htr);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.row .r .lab{margin-top:3px}
.row.done b{text-decoration:line-through;color:var(--t3)}.row.done{background:transparent}
.row .x{color:var(--t3);padding:6px}
.tag{display:inline-block;font:var(--Lw) var(--Lsz) var(--L);letter-spacing:var(--Lsp);text-transform:uppercase;padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--t2);vertical-align:1px}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.tag.bad{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}.tag.warn{background:color-mix(in srgb,var(--a) 15%,transparent);color:var(--a)}
.box{position:relative;background:var(--s2);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-bottom:10px;text-align:left}
.box b.t{font:500 18px/1.2 var(--U);letter-spacing:-.01em;display:block;margin:9px 0 5px}[data-theme=ivory] .box b.t{font:500 22px/1.15 var(--D)}
.box p{margin:0;color:var(--t2);font-size:13.500px;line-height:1.5}
.box .lk{font:500 12.500px var(--U);display:inline-block;margin:12px 16px 0 0;text-decoration:none;color:var(--a)}
.next{background:linear-gradient(150deg,color-mix(in srgb,var(--a) 11%,var(--s2)),var(--s2) 70%);border-color:color-mix(in srgb,var(--a) 26%,transparent)}
.next .big{font:var(--dw) 40px/1 var(--D);letter-spacing:var(--htr);color:var(--tx);text-transform:lowercase}
.alert{padding:13px 15px;border-radius:16px;font-size:13.500px;line-height:1.45;margin:10px 0;background:color-mix(in srgb,var(--a) 9%,transparent);color:var(--tx);border:1px solid color-mix(in srgb,var(--a) 22%,transparent)}
.alert.bad{background:color-mix(in srgb,var(--c) 10%,transparent);border-color:color-mix(in srgb,var(--c) 28%,transparent)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--t2);font:500 13px var(--U);padding:6px 0 10px;text-transform:lowercase}.back svg{width:17px;height:17px}
.opt{display:flex;align-items:center;gap:15px;padding:17px;border-radius:var(--r);border:1px solid var(--ln);background:var(--s2);margin-bottom:10px;width:100%}
.opt>svg.i{width:24px;height:24px;color:var(--t2)}
.opt.on{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a);background:color-mix(in srgb,var(--a) 7%,var(--s2))}.opt.on>svg.i{color:var(--a)}
.opt.bus.on{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b);background:color-mix(in srgb,var(--b) 8%,var(--s2))}.opt.bus.on>svg.i{color:var(--b)}
.opt .big{font:var(--dw) 33px/1 var(--D);letter-spacing:var(--htr);font-variant-numeric:tabular-nums}.opt .g{flex:1}
.opt .m{font-size:12px;line-height:1.5;color:var(--t2);margin-top:5px;text-transform:lowercase}
.go{position:relative;display:block;width:100%;text-align:center;background:var(--a);color:var(--aT);font:600 16.500px var(--U);letter-spacing:.01em;padding:18px;border-radius:20px;margin-top:8px;overflow:hidden;box-shadow:0 12px 30px -10px color-mix(in srgb,var(--a) 65%,transparent)}
.go:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.34) 50%,transparent 60%);transform:translateX(-100%);animation:sheen 4s var(--ease) infinite}
@keyframes sheen{55%,100%{transform:translateX(100%)}}
.go.bus{background:var(--b);color:var(--bg);box-shadow:0 12px 30px -10px color-mix(in srgb,var(--b) 60%,transparent)}
.go.stop{background:none;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:none}.go.stop:after{display:none}
.ghost{display:block;width:100%;text-align:center;padding:14px 10px;border-radius:16px;border:1px solid var(--ln);font:500 13.500px var(--U);margin-top:8px;color:var(--t2);text-decoration:none;background:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form{display:grid;gap:8px;margin:6px 0 4px}.form .ln{display:flex;gap:8px}
.form .add{background:var(--tx);color:var(--bg);font:600 13px var(--U);padding:0 18px;border-radius:var(--r2);flex:none;text-transform:lowercase}
.dch{display:flex;gap:6px}.dch button{flex:1;text-align:center;padding:11px 0;border-radius:12px;border:1px solid var(--ln);font:500 13.500px var(--U);color:var(--t2)}.dch button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
/* ---------- trajet ---------- */
.hudT{display:flex;align-items:flex-end;gap:16px;padding-top:2px}
.hudT .big{font:200 68px/.86 var(--D);letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--tx)!important}
[data-theme=ivory] .hudT .big{font-weight:400;letter-spacing:-.03em}
.hudT .big small{font:var(--Lw) var(--Lsz) var(--L);letter-spacing:var(--Lsp);color:var(--t3);margin-left:8px;text-transform:uppercase}
.hudT .col{flex:1}.hudT .col .lab{margin-top:12px}.hudT .side{text-align:right}.hudT .side b{font:var(--dw) 27px/1 var(--D);letter-spacing:var(--htr);display:block;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;margin:18px 0 6px;background:var(--ln2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:2px;background:var(--a);transition:width .8s var(--ease)}
.stages{display:flex;gap:6px;margin:16px 0 2px}
.stages span{flex:1;text-align:center;font:var(--Lw) var(--Lsz) var(--L);letter-spacing:var(--Lsp);padding:9px 2px;border-radius:99px;border:1px solid var(--ln);color:var(--t3)}
.stages span.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}.stages span.done{color:var(--ok)}
.steps .s{display:flex;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--ln);font-size:14.500px}
.steps .s svg{color:var(--t3)}.steps .s.past{opacity:.32}.steps .s.cur{font-weight:600}.steps .s.cur svg{color:var(--a)}
.steps .s .dd{margin-left:auto;font-size:12.500px;color:var(--t2);flex:none;font-variant-numeric:tabular-nums}
.line{position:relative;margin:10px 0 6px;padding-left:2px}
.st{display:flex;align-items:center;gap:16px;width:100%;padding:11px 0;position:relative}
.st:before{content:"";position:absolute;left:9px;top:-50%;height:100%;width:2px;background:var(--ln2)}
.st:first-child:before{display:none}.st.done:before,.st.cur:before{background:var(--b)}
.st .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ln2);background:var(--s1);z-index:1;flex:none;display:grid;place-items:center}
.st .dot svg{width:11px;height:11px;stroke-width:3}
.st.done .dot{background:var(--b);border-color:var(--b);color:var(--bg)}
.st.cur .dot{border-color:var(--b);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--b) 55%,transparent)}100%{box-shadow:0 0 0 13px transparent}}
.st .nm{flex:1;font:400 15.500px var(--U)}.st.done .nm{color:var(--t3)}
.st.cur .nm,.st.end .nm{font-weight:600}.st .x{font:var(--Lw) var(--Lsz) var(--L);letter-spacing:var(--Lsp);color:var(--t3)}.st.end .x{color:var(--b)}
/* ---------- marqueurs ---------- */
.me{width:44px;height:44px;position:relative;display:grid;place-items:center}
.me:before{content:"";position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--a) 22%,transparent);animation:ring 2.800s var(--ease) infinite}
@keyframes ring{from{transform:scale(.45);opacity:.9}to{transform:scale(1.5);opacity:0}}
.me .puck{position:relative;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--a);border:3.500px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.45)}
.me .cone{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-64px 0 0 -32px;transform-origin:50% 100%;display:none;background:conic-gradient(from -26deg at 50% 100%,transparent 0,color-mix(in srgb,var(--a) 50%,transparent) 26deg,transparent 52deg);-webkit-mask-image:radial-gradient(circle at 50% 100%,#000 0,transparent 68%);mask-image:radial-gradient(circle at 50% 100%,#000 0,transparent 68%)}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 3px;transform:rotate(-45deg);background:var(--tx);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.pin i{width:9px;height:9px;border-radius:50%;background:var(--bg)}
.sdot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.500px solid var(--b)}.sdot.done{background:var(--b)}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--tx);border:2.500px solid var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tl{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);border:1px solid var(--ln2);font:500 15px/1 var(--D);padding:8px 13px 8px 9px;border-radius:99px;transform:translate(14px,-50%);box-shadow:0 8px 22px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.tl svg{width:15px;height:15px;stroke-width:2.400;color:var(--a)}
.tl.s{font-size:11.500px;padding:5px 9px;color:var(--t2);box-shadow:none}
.rflow{stroke-dasharray:3 26;animation:flow 1.700s linear infinite;opacity:.55}
@keyframes flow{to{stroke-dashoffset:-29}}
.rglow{filter:var(--glow)}.bglow{filter:none}
.scan{height:140px;display:grid;place-items:center}
.scan i{width:54px;height:54px;border-radius:50%;border:2px solid var(--ln2);border-top-color:var(--a);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- profil & modules ---------- */
.rank{display:flex;gap:16px;align-items:center}.rank .lv{font:var(--dw) 34px/1 var(--D);letter-spacing:var(--htr);text-transform:capitalize;margin:5px 0 2px}
.stat{background:var(--s2);border:1px solid var(--ln);border-radius:18px;padding:14px}.stat b{font:var(--dw) 29px/1 var(--D);letter-spacing:var(--htr);display:block;margin-bottom:8px;font-variant-numeric:tabular-nums}
.sw{height:92px;border-radius:20px;border:1px solid var(--ln);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px}
.sw i{position:absolute;inset:0}.sw span{position:relative;font:500 13px var(--U);color:#fff;mix-blend-mode:difference}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--a)}
.vx{padding:14px 13px 13px;border-radius:18px;border:1px solid var(--ln);background:var(--s2);display:flex;flex-direction:column;gap:4px}
.vx i{display:block;height:14px;margin-bottom:6px;background:repeating-linear-gradient(90deg,var(--t3) 0 2px,transparent 2px 5px);clip-path:polygon(0 60%,8% 30%,16% 70%,24% 10%,32% 80%,40% 40%,48% 90%,56% 20%,64% 65%,72% 5%,80% 75%,88% 35%,100% 60%,100% 100%,0 100%)}
.vx b{font:500 14.500px var(--U);text-transform:capitalize}.vx .lab{font-size:calc(var(--Lsz) - 1px)}

   if(cur&&cur[2]==='cal'){prev=cur;got++;continue}

 const r=j.routes[0];let idx=0;const steps=r.legs[0].steps.map(s=>{const m=s.maneuver,mod=OMOD[m.modifier]||['',0],on=s.name?' sur '+s.name:'';let t;

  if(mm[1]){days=new Set();for(const part of mm[1].split(',')){const ab=part.trim().split('-').map(x=>DN.indexOf(x.trim()));if(!part.trim())continue;if(ab[0]<0)return null;if(ab.length<2)days.add(ab[0]);else if(ab[1]<0)return null;else for(let i=ab[0];;i=(i+1)%7){days.add(i);if(i===ab[1])break}}}
  const rest=mm[2].trim();if(/^(off|closed)/.test(rest)){any=true;if(!days||days.has(d))res={open:false};continue}
  const sp=[...rest.matchAll(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/g)];if(!sp.length)return null;any=true;if(days&&!days.has(d))continue;res={open:false};
  for(const s of sp){const o=+s[1]*60+ +s[2];let c=+s[3]*60+ +s[4];if(c<=o)c+=1440;if(m>=o&&m<c){res={open:true,until:String(Math.floor(c%1440/60)).padStart(2,'0')+'h'+String(c%60).padStart(2,'0'),left:c-m};break}}}

 if(!ll(p)&&navigator.onLine)await ensureLL(p);if(cur!==p)return;

 if(!me){opt={};return renderDest()}
 const walk=await routeWalk(me,ll(p),p.id);if(cur!==p)return;const bus=planBus(me,p);
 opt={walk,bus,mode:bus&&bus.dur<walk.dur*.85?'bus':'walk'};
 G.route.clearLayers();L.polyline(walk.pts,{color:css('--a'),weight:5,opacity:.9,className:'rglow',dashArray:walk.src==='direct'?'4 12':null}).addTo(G.route);L.polyline(walk.pts,{color:'#fff',weight:2,className:'rflow'}).addTo(G.route);renderDest()}

 let x=`<div class="hdr"><button class="back" data-a="back">${ic('back')} RETOUR</button>${core?'':`<button data-a="fav" style="color:${isFav?'var(--a)':'var(--mu)'}">${ic('star')}</button>`}</div><h1>${esc(p.n)}</h1><div class="sub">${esc(p.a||'')}</div><div style="margin:10px 0">${stateTag(p)} ${S.coords[p.id]&&S.coords[p.id][2]==='approx'?'<span class="tag warn">Position approximative</span>':''}</div>`;
 if(p.hr)x+=`<div class="sub">Horaires (OpenStreetMap) : ${esc(frHours(p.hr))}</div>`;
 if(p.note)x+=`<div class="sub" style="margin-bottom:10px">${esc(p.note)}</div>`;
 if(opt.err)x+='<div class="alert bad">Adresse pas encore localisée : il faut du réseau la première fois. Tu peux aussi corriger sa position une fois sur place.</div>';
 else if(opt.load)x+='<div class="scan" style="height:90px"><i style="width:70px;height:70px"></i></div><div class="lab" style="text-align:center">CALCUL DU TRACÉ…</div>';

 else{const w=opt.walk,b=opt.bus,m=opt.mode,dur=m==='bus'?b.dur:w.dur,eta=new Date(Date.now()+dur*1000),o=pState(p,eta),now=pState(p,new Date()),wa=wxAdvice();

  else if(o&&o.left<30)x+=`<div class="alert">À ton arrivée (${clock(eta)}), il restera ${o.left} min avant la fermeture.</div>`;

async function sendChat(txt){if(busy||(!txt&&!pend))return;busy=true;const m={r:'u',t:txt||'(photo)'},img=pend;pend=null;if(img)m.i=1;S.chat.push(m);S.chat=S.chat.slice(-40);save();rEtu(true);
 try{const hist=S.chat.slice(-13,-1).map(x=>({role:x.r==='u'?'user':'model',parts:[{text:x.t}]})),parts=[{text:(curC&&curC.tr?'Contexte — transcription du cours « '+curC.n+' » :\n'+curC.tr.slice(0,60000)+'\n\n':'')+m.t}];if(img)parts.push({inlineData:{mimeType:'image/jpeg',data:img}});
  S.chat.push({r:'m',t:await gtext(hist.concat([{role:'user',parts}]),SYSf())})}catch(e){S.chat.push({r:'m',t:errTxt(e),e:1})}
 busy=false;save();if(mod==='etu'&&eT==='ia'){rEtu(true);body.scrollTop=body.scrollHeight}}
/* enregistreur continu : un seul flux, sauvegarde toutes les minutes, écran éteint possible */
const TRP='Transcris cet enregistrement de cours en français, de façon propre et fidèle. Supprime les hésitations, répétitions et tics de langage ; corrige la ponctuation ; découpe en paragraphes ; ajoute un intertitre court sur une ligne commençant par « ## » à chaque changement de thème. Garde tout le contenu : ne résume pas, n’invente rien, écris [inaudible] si un passage est incompréhensible. Donne uniquement la transcription.';
async function recStart(){try{const st=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:true,autoGainControl:true}}),id=uid(),mt=['audio/mp4;codecs=mp4a.40.2','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'',
  c={id,n:'Cours du '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),at:Date.now(),dur:0,seg:1,done:0,tr:''},mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});
  rec={st,c,mr,t0:Date.now(),ch:[],n:0};S.courses.unshift({id,n:c.n,at:c.at,dur:0,seg:1});save();idb.set('course:'+id,c);
  mr.ondataavailable=e=>{if(!e.data.size||!rec)return;rec.ch.push(e.data);if(++rec.n%6===0)idb.set('aud:'+id+':0',new Blob(rec.ch,{type:mr.mimeType})).catch(()=>{})};
  mr.onstop=()=>recEnd();mr.start(10000);
  rec.iv=setInterval(()=>{const e=$('#recT');if(e&&rec)e.textContent=mm(Math.floor((Date.now()-rec.t0)/1000))},1000);
  if('mediaSession'in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:'Enregistrement du cours',artist:'CAP'})}catch(_){}
  sfx('ok');rEtu(true)}catch(e){toast('Micro refusé ou indisponible')}}
function recStop(){if(!rec)return;clearInterval(rec.iv);rec.c.dur=Math.round((Date.now()-rec.t0)/1000);if(rec.mr.state!=='inactive')rec.mr.stop()}
async function recEnd(){const r=rec,c=r.c,b=new Blob(r.ch,{type:r.mr.mimeType||'audio/webm'});r.st.getTracks().forEach(t=>t.stop());rec=null;await idb.set('aud:'+c.id+':0',b);const m=S.courses.find(x=>x.id===c.id);if(m)m.dur=c.dur;save();await idb.set('course:'+c.id,c);curC=c;toast('Cours enregistré · transcription lancée');rEtu();await trAll(c)}
async function gUpload(blob,mime){const U='https://generativelanguage.googleapis.com/',st=await fetch(U+'upload/v1beta/files',{method:'POST',headers:{'x-goog-api-key':S.gk,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(blob.size),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:'cours'}})}),u=st.headers.get('x-goog-upload-url');
 if(!u){const e=new Error('upload');e.msg='envoi du fichier audio refusé';throw e}
 let f=(await(await fetch(u,{method:'POST',headers:{'X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize'},body:blob})).json()).file;
 for(let k=0;k<60&&f.state==='PROCESSING';k++){await new Promise(z=>setTimeout(z,3000));f=await(await fetch(U+'v1beta/'+f.name,{headers:{'x-goog-api-key':S.gk}})).json()}return f.uri}
async function trAll(c){if(!S.gk)return toast('Ajoute ta clé Gemini pour transcrire');if(!navigator.onLine)return toast('Pas de réseau : relance la transcription plus tard');const b=await idb.get('aud:'+c.id+':0');if(!b)return toast('Audio introuvable');
 c.err='';c.busy=1;if(mod==='etu')rEtu(true);const mime=(b.type||'audio/webm').split(';')[0];
 try{const mk=async mt=>b.size<13e6?{inlineData:{mimeType:mt,data:await blobB64(b)}}:{fileData:{mimeType:mt,fileUri:await gUpload(b,mt)}};let t;
  try{t=await gtext([await mk(mime),{text:TRP}])}catch(e){if(e.status!==400||!/webm/.test(mime))throw e;t=await gtext([await mk('video/webm'),{text:TRP}])}
  c.tr=t.trim();c.done=1}catch(e){c.err=errTxt(e)}
 c.busy=0;await idb.set('course:'+c.id,c);if(mod==='etu'&&curC&&curC.id===c.id&&!rec)rEtu(true)}
async function mkFiche(c){if(busy)return;busy=true;rEtu(true);try{const j=JSON.parse(await gtext([{text:'À partir de cette transcription de cours, produis une fiche de révision en JSON strict : {"titre":string,"resume":string (8 à 12 phrases),"points":[string] (idées clés, 6 à 12),"definitions":[{"terme":string,"def":string}],"cartes":[{"q":string,"r":string}] (12 à 20 cartes question/réponse),"questions":[string] (5 questions d’examen probables)}. Reste fidèle au cours, n’ajoute rien d’extérieur.\n\nTRANSCRIPTION :\n'+c.tr.slice(0,120000)}],SYSf(),true));
  c.fiche=j;if(j.titre&&/^Cours du /.test(c.n)){c.n=j.titre;const m=S.courses.find(x=>x.id===c.id);if(m)m.n=j.titre}const m=S.courses.find(x=>x.id===c.id);if(m)m.f=1;save();await idb.set('course:'+c.id,c);addXP(40,'Fiche de révision créée')}catch(e){toast(errTxt(e),6000)}busy=false;rEtu(true)}
const ficheTxt=c=>{const f=c.fiche;return f?[f.titre,'',f.resume,'','IDÉES CLÉS'].concat(f.points.map(p=>'• '+p),['','DÉFINITIONS'],(f.definitions||[]).map(d=>'• '+d.terme+' : '+d.def),['','QUESTIONS'],(f.questions||[]).map(q=>'• '+q)).join('\n'):c.tr};
function rEtu(still){let x=head1('Assistant · cours · fiches','Études')+'<div class="tabs">'+[['ia','Assistant','bolt'],['cours','Cours','note'],['fiches','Fiches','book']].map(t=>`<button class="tb ${eT===t[0]?'on':''}" data-y="et" data-v="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('')+'</div>';
 if(!S.gk&&eT!=='cours')x+=`<div class="box next" style="margin-top:16px"><div class="lab">À faire une fois</div><b class="t">Brancher l’IA</b><p>Crée une clé gratuite sur aistudio.google.com (« Get API key ») et colle-la ici. Elle sert à l’assistant, à la transcription des cours et aux voix.</p><div class="form" style="margin-top:12px"><div class="ln"><input id="gkI" type="password" placeholder="Clé API Gemini"><button class="add" data-y="gk">OK</button></div></div></div>`;
 if(eT==='ia'){if(curC)x+=`<div class="alert">Contexte : cours « ${esc(curC.n)} ». <a href="#" data-y="noctx">Retirer</a></div>`;
  x+='<div class="tabs">'+PRE.map((p,i)=>`<button class="tb" data-y="pre" data-v="${i}">${p[0]}</button>`).join('')+'</div><div class="chat">'+(S.chat.length?S.chat.map((m,i)=>`<div class="msg ${m.r}${m.e?' err':''}">${m.i?'<span class="tag">photo jointe</span><br>':''}${m.r==='m'?md(m.t):esc(m.t).replace(/\n/g,'<br>')}${m.r==='m'&&!m.e?`<div class="mact"><button data-y="mspk" data-v="${i}">Écouter</button><button data-y="mcpy" data-v="${i}">Copier</button><button data-y="mnote" data-v="${i}">→ Note</button></div>`:''}</div>`).join(''):'<div class="sub" style="padding:18px 0">Pose une question, envoie la photo d’un tableau, d’un article ou d’un schéma, ou choisis un modèle ci-dessus.</div>')+(busy?'<div class="msg m"><span class="dots"><i></i><i></i><i></i></span></div>':'')+'</div>';
  x+=`<div class="comp">${pend?'<span class="tag ok">photo prête</span>':''}<label class="cbtn">${ic('plus')}<input type="file" accept="image/*" id="phI" hidden></label><textarea id="chI" rows="1" placeholder="Message…"></textarea><button class="cbtn send" data-y="send">${ic('up')}</button></div>${S.chat.length?'<button class="ghost" data-y="clr">Nouvelle conversation</button>':''}`}
 if(eT==='cours'){if(rec)x+=`<div class="recw on"><div class="lab">Enregistrement en cours</div><b id="recT">${mm(Math.floor((Date.now()-rec.t0)/1000))}</b><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button class="go stop" data-y="rstop">Terminer et transcrire</button><div class="sub">Durée libre. Tu peux éteindre l’écran : l’audio est sauvegardé chaque minute et la transcription complète se lance quand tu termines.</div></div>`;
  else if(curC){const c=curC,f=c.fiche;x+=`<button class="back" data-y="cback">${ic('back')} tous les cours</button><input id="cN" value="${esc(c.n)}" style="font:var(--hw) 24px var(--D);border:0;background:none;padding:0;border-radius:0"><div class="sub">${whenTxt(c.at)} · ${mm(c.dur||0)} · ${c.busy?'transcription en cours…':c.tr?'transcrit':'pas encore transcrit'}</div>`;
   if(c.err)x+=`<div class="alert bad">${esc(c.err)}</div>`;
   x+=`<div class="two" style="margin-top:6px"><button class="go" data-y="fiche" style="margin:8px 0 0;font-size:14.500px;padding:15px 8px" ${c.tr?'':'disabled'}>${busy?'Création…':f?'Refaire la fiche':'Créer la fiche'}</button><button class="ghost" data-y="ask" style="padding:15px 8px">Interroger ce cours</button><button class="ghost" data-y="trall">${c.tr?'Retranscrire':'Transcrire'}</button><button class="ghost" data-y="cshare">Partager</button></div>`;
   if(f){x+=`<div class="lab sec">Résumé</div><div class="sub" style="color:var(--tx);font-size:14.500px">${esc(f.resume)}</div><div class="lab sec">Idées clés</div>`+f.points.map(p=>`<div class="row"><span class="g" style="white-space:normal">${esc(p)}</span></div>`).join('');
    if((f.definitions||[]).length)x+='<div class="lab sec">Définitions</div>'+f.definitions.map(d=>`<div class="row"><span class="g"><b>${esc(d.terme)}</b><span class="m" style="white-space:normal">${esc(d.def)}</span></span></div>`).join('');
    if((f.cartes||[]).length){const k=f.cartes[cardI%f.cartes.length];x+=`<div class="lab sec">Cartes · ${cardI%f.cartes.length+1} / ${f.cartes.length}</div><button class="flash ${cardF?'f':''}" data-y="flip"><span class="lab">${cardF?'Réponse':'Question'}</span><b>${esc(cardF?k.r:k.q)}</b><span class="sub">${cardF?'':'Touche pour voir la réponse'}</span></button><div class="two"><button class="ghost" data-y="cprev">Précédente</button><button class="ghost" data-y="cnext">Suivante</button></div>`}
    if((f.questions||[]).length)x+='<div class="lab sec">Questions probables</div>'+f.questions.map(q=>`<div class="row"><span class="g" style="white-space:normal">${esc(q)}</span></div>`).join('')}
   x+=`<div class="lab sec">Transcription</div><div class="sub tr" style="color:var(--tx)">${c.tr?md(c.tr):'Pas encore de transcription. '+(S.gk?'Touche « Transcrire ».':'Ajoute ta clé Gemini dans Profil, puis « Transcrire ».')}</div><button class="ghost" data-y="cdel" style="color:var(--c);margin-top:18px">Supprimer ce cours</button>`}
  else{x+=`<div class="recw"><button class="recb" data-y="rstart"><i></i></button><b>Enregistrer un cours</b><div class="sub">Enregistrement continu, sans limite de durée. À la fin : transcription propre avec intertitres, puis fiche de révision.</div><label class="ghost" style="display:block">Importer un audio du dictaphone<input type="file" accept="audio/*" id="auI" hidden></label></div>`;
   x+='<div class="lab sec">Mes cours</div>'+(S.courses.map(c=>`<button class="row" data-y="copen" data-v="${c.id}">${ic('note')}<span class="g"><b>${esc(c.n)}</b><span class="m">${whenTxt(c.at)} · ${mm(c.dur||0)}${c.f?' · fiche prête':''}</span></span></button>`).join('')||'<div class="sub">Aucun cours pour l’instant.</div>')}}
 if(eT==='fiches'){const l=S.courses.filter(c=>c.f);x+='<div class="lab sec">Fiches de révision</div>'+(l.map(c=>`<button class="row" data-y="copen" data-v="${c.id}">${ic('book')}<span class="g"><b>${esc(c.n)}</b><span class="m">${whenTxt(c.at)}</span></span></button>`).join('')||'<div class="sub">Enregistre un cours puis touche « Créer la fiche » : résumé, idées clés, définitions, cartes et questions probables apparaîtront ici.</div>')+'<div class="lab sec">Méthode</div>'+[['Réviser par rappel actif','Cache la réponse, formule-la à voix haute, puis vérifie : c’est ce que font les cartes.'],['Espacer','Revois une fiche le lendemain, puis à 3 jours, puis à une semaine. Mets un rappel dans Orga.'],['Interroger le cours','Bouton « Interroger ce cours » : l’assistant répond à partir de ta transcription.']].map(t=>`<div class="box"><b class="t" style="margin-top:0">${t[0]}</b><p>${t[1]}</p></div>`).join('')}
 P(x,still);if(eT==='ia'&&!still)body.scrollTop=body.scrollHeight}
body.addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==='phI'){try{pend=await imgB64(f);toast('Photo jointe');rEtu(true)}catch(_){toast('Image illisible')}}
 if(e.target.id==='auI'){if(f.size>150e6)return toast('Fichier trop lourd (150 Mo max)');const id=uid(),c={id,n:f.name.replace(/\.[^.]+$/,''),at:Date.now(),dur:0,seg:1,done:0,tr:''};await idb.set('aud:'+id+':0',f);S.courses.unshift({id,n:c.n,at:c.at,dur:0,seg:1});save();await idb.set('course:'+id,c);curC=c;rEtu();trAll(c)}});
body.addEventListener('click',async e=>{const t=e.target.closest('[data-y]');if(!t)return;const v=t.dataset.v;if(t.tagName==='A')e.preventDefault();
 switch(t.dataset.y){
  case'et':eT=v;if(v!=='cours'&&v!=='ia')curC=null;return rEtu();
  case'me1':S.nm=$('#nmI').value.trim();const na=$('#haI').value.trim();if(na!==(S.homeA||'')){S.homeA=na;if(S.coords)delete S.coords.home;if(S.routes)S.routes={}}S.ctx=$('#cxI').value.trim();homeP();save();toast('Infos enregistrées');return render(true);
  case'gk':S.gk=$('#gkI').value.trim();save();toast(S.gk?'Clé enregistrée':'Clé retirée');voxPrep(S.vox);return render(true);
  case'mapb':S.mapb=+v;save();document.documentElement.style.setProperty('--mapb',S.mapb);return rMe(true);
  case'vox':S.vox=v;save();rMe(true);if(v==='sys')return sayTTS(CT.test,true);if(!S.gk)return toast('Ajoute d’abord ta clé Gemini');

  case'pre':{const i=$('#chI');i.value=PRE[+v][1];return i.focus()}

  case'mspk':return speak(S.chat[+v].t.replace(/[*#]/g,''));
  case'mcpy':try{await navigator.clipboard.writeText(S.chat[+v].t);toast('Copié')}catch(_){toast('Copie impossible')}return;
  case'mnote':S.notes.push({id:uid(),t:S.chat[+v].t,at:Date.now()});save();return toast('Ajouté à tes notes');
  case'rstart':return recStart();case'rstop':return recStop();
  case'copen':curC=(await idb.get('course:'+v))||null;if(!curC)return toast('Cours introuvable');cardI=0;cardF=false;eT='cours';return rEtu();

document.documentElement.style.setProperty('--mapb',S.mapb);
